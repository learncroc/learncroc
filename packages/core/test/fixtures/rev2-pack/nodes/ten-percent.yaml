# yaml-language-server: $schema=https://learncroc.github.io/schema/v1/node.schema.json
id: ten-percent
title: Start from ten per cent
tagline: Divide by ten, then build
estMinutes: 3
bigIdea: >
  10% of an amount is that amount divided by 10. Other percentages are built from it: 5% is half
  of 10%, 20% is double, and 25% is a quarter of the whole.
objectives:
  - Find 10% of an amount by dividing by 10
  - Build 5%, 20% and 25% from 10% or from simple fractions
visual:
  kind: figure
  asset: assets/img/hundred-grid.svg
  alt: "A ten by ten grid of squares with the top two rows shaded."

misconceptions:
  subtract-ten:
    label: Thinks finding 10% means taking 10 away
    upstream: per-hundred
    hint: "10% is a tenth of the amount. What is a tenth of 80?"
  percent-as-pounds:
    label: Reads the percentage as an amount of money
    upstream: per-hundred
    hint: "10% is not £10. It is 10 of every 100 parts of the bill."

hook:
  blocks:
    - type: story
      text: "Lunch costs £36. You want to leave a 10% tip."
  interaction:
    kind: choice
    id: hook-q
    prompt: What tip do you leave?
    confidence: true
    options:
      - { id: twenty-six, text: "£26", misconception: subtract-ten }
      - { id: three-sixty, text: "£3.60" }
      - { id: ten, text: "£10", misconception: percent-as-pounds }
    answer: three-sixty
  lotsGuess: ten
  reveal: "£3.60. Ten per cent is one tenth: move the decimal point one place."

screens:
  - id: s1-tenth
    role: resolve-hook
    newIdea: 10% is the amount divided by 10
    blocks:
      - type: story
        text: "A jacket costs £80."
    interaction:
      kind: numeric
      id: s1-q
      prompt: What is 10% of £80?
      answer: 8
      tolerance: 0
      unit: "£"
      onWrong:
        "70": { misconception: subtract-ten, feedback: "That takes 10 away. 10% is a tenth." }
    reveal:
      text: "£8: one tenth of £80. Ten of those make the whole price."

  - id: s2-build
    role: teach
    newIdea: Build other percentages from 10%
    blocks:
      - type: story
        text: "With 10% in hand, 5% is half of it and 20% is double."
    interaction:
      kind: numeric
      id: s2-q
      prompt: What is 5% of £80?
      answer: 4
      tolerance: 0
      unit: "£"
    reveal:
      text: "Half of £8 is £4. Halving and doubling 10% covers most receipts."

  - id: s3-transfer
    role: transfer
    blocks:
      - type: story
        text: "A £60 bill. Service is 15%."
    interaction:
      kind: numeric
      id: s3-q
      prompt: How much is the service charge?
      answer: 9
      tolerance: 0
      unit: "£"
      onWrong:
        "45": { misconception: subtract-ten, feedback: "That takes 15 away. Find 10% and 5% of £60, then add them." }
    reveal:
      text: "10% is £6, 5% is £3, together £9."

items:
  - id: i1
    kind: numeric
    level: recall
    difficulty: 1
    placement: true
    prompt: "What is 10% of {n}?"
    params:
      vars: { n: [50, 120, 300, 90] }
      answerExpr: "n / 10"
    answer: 5
    tolerance: 0
  - id: i2
    kind: numeric
    level: apply
    difficulty: 2
    prompt: "What is 20% of 45?"
    answer: 9
    tolerance: 0
  - id: i3
    kind: order
    level: transfer
    difficulty: 3
    prompt: "Put these from smallest to largest."
    items: ["5% of 200", "10% of 150", "25% of 80", "20% of 120"]
    answer: [0, 1, 2, 3]
    why: "10, 15, 20 and 24."

sayIt:
  prompt: "Explain to a friend how to find 15% of a bill in your head. One sentence."
  keyPoints:
    - { id: tenth, text: "find 10% by dividing by ten", keywords: ["divide by 10", "a tenth", "move the decimal"] }
    - { id: build, text: "add half of that for 5%", keywords: [half, "5%", "add"] }
  minHits: 1
  exemplar: "Divide by ten for 10%, halve that for 5%, and add the two together."

sources:
  - { id: bbc-bitesize, title: "Percentages", by: "BBC Bitesize", url: "https://www.bbc.co.uk/bitesize/topics/zgdx6sg" }

status: draft
