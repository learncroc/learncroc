# yaml-language-server: $schema=../../../schemas/node.schema.json
id: bayes-frequency
title: Bayes with 1,000 people
tagline: Why a good test can mostly flag healthy people
estMinutes: 6
bigIdea: >
  To read a positive test, picture 1,000 people. With a 1% base rate, a test that catches
  90% of cases and wrongly flags 9% of healthy people finds 9 true cases and about 89 false
  alarms, so a positive means roughly a 1 in 10 chance. When a condition is rare, false
  alarms from the many healthy people outnumber the true hits.
objectives:
  - Build a crowd of 1,000 from a base rate, a hit rate and a false-alarm rate
  - Compute the share of positives that are true
  - Predict which change makes a positive result more trustworthy
concepts: [prob.bayes, prob.natural-frequencies]

visual:
  kind: html
  asset: assets/interactive/crowd-1000.html
  height: 640
  alt: "A grid of 1,000 people: diamonds have the condition, circles are healthy. Sliders set the base rate, the hit rate and the false-alarm rate; a button tests everyone and fills in the positives."

misconceptions:
  accuracy-is-answer:
    label: Thinks a test that catches 90% of cases means a positive is 90% likely to be right
    upstream: conditional
    hint: "90% of whom? That counts inside the sick. Your question counts inside the positives."
  ignore-false-alarms:
    label: Forgets the healthy people who test positive
    hint: "Look at the 990 healthy people. 9% of them is a crowd of its own."
  base-rate-neglect:
    label: Ignores how rare the condition is before the test
    upstream: base-rates
    hint: "How common was the condition before anyone was tested? Start the crowd there."
  ignore-test:
    label: Thinks a positive changes nothing, so the chance stays at the base rate
    hint: "Before the test, 10 in 1,000. After a positive, you're one of 98. Has the crowd you belong to changed?"
  hit-rate-fix:
    label: Thinks raising the hit rate is the main way to make a positive trustworthy
    hint: "Which group is bigger: the few sick people the test misses, or the many healthy people it flags?"

hook:
  blocks:
    - type: story
      text: >
        A condition affects 1% of people your age. A screening test catches 90% of cases and
        wrongly flags 9% of healthy people. Your result: positive.
  interaction:
    kind: choice
    id: hook-q
    prompt: How likely is it that you actually have the condition?
    confidence: true
    options:
      - { id: p90, text: "About 90%", misconception: accuracy-is-answer }
      - { id: p81, text: "About 81%", misconception: accuracy-is-answer }
      - { id: p10, text: "About 10%" }
      - { id: p1, text: "About 1%", misconception: ignore-test }
    answer: p10
  lotsGuess: p90

screens:
  - id: s1-crowd
    newIdea: Turn the percentages into a crowd of 1,000
    blocks:
      - type: story
        text: "1,000 people: 10 have the condition, 990 don't. The test catches 9 of the 10."
    interaction:
      kind: numeric
      id: s1-q
      prompt: It also flags 9% of the 990 healthy people. How many false alarms is that?
      answer: 89
      tolerance: 0.5
      feedbackRight: "About 89 healthy people flagged."
      onWrong:
        "9": { misconception: ignore-false-alarms, feedback: "9 is the true hits. Now take 9% of the 990 healthy people." }
        "90": { feedback: "Close: 9% of 990, not of 1,000." }
    reveal:
      text: >
        About 89 false alarms, next to 9 true hits. Press Test everyone: the lit crowd is
        mostly healthy circles. Of 98 positives, 9 have it, about 1 in 10.
      visualState: { note: "9 true hits, 89 false alarms" }
    alts:
      simpler: "Most positives come from the big healthy group, because even a small error rate of a big group is a lot of people."
      analogy: "A smoke alarm that goes off for burnt toast. Most alarms in a kitchen are toast, not fire, because toast happens far more often."
    src: [gigerenzer-2007]

  - id: s2-share
    newIdea: Your chance is true hits out of all positives
    blocks:
      - type: story
        text: "Same test. This time the condition affects 10% of the people tested: 100 in 1,000."
    interaction:
      kind: numeric
      id: s2-q
      prompt: Of everyone who tests positive, what percent have the condition?
      answer: 53
      tolerance: 2
      unit: "%"
      feedbackRight: "90 true hits out of 171 positives."
      onWrong:
        "90": { misconception: accuracy-is-answer, feedback: "90% counts inside the sick. Count inside the positives: 90 true hits plus 9% of 900." }
        "10": { misconception: ignore-test, feedback: "That's the base rate. The positive moved you into a smaller crowd: who's in it?" }
    reveal:
      text: >
        90 true hits against 81 false alarms: about 53%. Same test, ten times the base rate,
        and a positive went from 1 in 10 to a coin flip. The test never changed. The crowd
        did.
      visualState: { note: "90 ÷ (90 + 81)" }

  - id: s3-lever
    newIdea: When a condition is rare, false alarms decide the answer
    blocks:
      - type: story
        text: "Back to 10 in 1,000. You can improve the test: catch more cases, or flag fewer healthy people."
    interaction:
      kind: html
      id: s3-q
      prompt: Keep the base rate at 10 in 1,000. Change the test until a positive means more likely sick than not.
      asset: assets/interactive/crowd-1000.html
      height: 640
      alt: "The crowd of 1,000 with sliders for base rate, hit rate and false alarms, and a readout of the share of positives who have the condition."
      goal: { kind: set, values: [base-default, real-majority], match: all }
      solution: [base-default, real-majority]
      fallback:
        kind: numeric
        prompt: "1,000 people, 10 sick, and the test catches 9 of them. At most how many false alarms keep a positive more likely sick than not?"
        answer: 8
        tolerance: 0
      feedbackRight: "Over half the positives are now real."
      onWrong:
        default: { misconception: hit-rate-fix, feedback: "Keep the base rate at 10 and fix the test. Even catching all 10 cases leaves 89 false alarms: try the false-alarm slider." }
    reveal:
      text: >
        Pushing the hit rate to 100% barely helped: 10 true hits still drowned in 89 false
        alarms. Cutting false alarms below 1% tipped it. For rare conditions, fewer false
        alarms is the lever that matters.
      visualState: { note: "false alarms set the answer" }
    alts:
      why: "With 990 healthy people and 10 sick ones, a 1-point change in the false-alarm rate moves about 10 people. A 10-point change in the hit rate moves 1."

  - id: s4-scanner
    blocks:
      - type: story
        text: >
          An airport scanner catches every real threat but flags 5% of innocent bags. Say 1
          bag in 100,000 holds a threat.
      - type: callout
        tone: illustrative
        text: "Illustrative numbers."
    visual:
      kind: widget
      widget:
        id: plot
        v: 1
        props:
          title: "How often is an alarm real?"
          kind: function
          x: { label: "threats per million bags", min: 1, max: 100000, scale: log }
          y: { label: "alarms that are real (%)", min: 0, max: 100 }
          series:
            - { id: real, label: "alarms that are real", expr: "100 * x / (x + 0.05 * (1000000 - x))", color: 2 }
          dataSource: illustrative
      alt: "A curve that stays near zero until threats become very common, then climbs: real alarms only pass 50% when about 1 bag in 20 holds a threat."
    interaction:
      kind: estimate
      id: s4-q
      prompt: In a million bags, about how many innocent bags get flagged for each real threat?
      scale: { min: 1, max: 100000, log: true, label: "innocent bags per real threat" }
      answer: 5000
      accept: { factor: 1.5 }
      feedbackRight: "About 50,000 false alarms for 10 real threats."
      onWrong:
        default: { misconception: base-rate-neglect, feedback: "Count it: 10 threats per million, and 5% of nearly a million innocent bags." }
    reveal:
      text: >
        About 5,000 innocent bags per real threat. A scanner that never misses, a needle-rare
        threat, and nearly every alarm is false. That's why a flag earns a second look, not
        an arrest.
      visualState: { props: { markerAt: 10 }, note: "10 per million" }

close:
  text: >
    About 10%. When doctors were given these exact numbers in one study, about 1 in 5 chose
    that answer. Percentages hide it; a crowd of 1,000 makes it plain.

  teaser: ""

items:
  - id: i1
    kind: numeric
    level: apply
    difficulty: 2
    prompt: "1,000 people; {s} of them have a condition. A test catches 90% of cases and flags 9% of healthy people. How many positives in total?"
    params:
      vars: { s: [10, 100, 50, 200] }
      answerExpr: "0.9 * s + 0.09 * (1000 - s)"
    answer: 98.1
    tolerance: 1
    onWrong:
      "9": { misconception: ignore-false-alarms, feedback: "That's only the true hits. Add the healthy people the test flags." }
    why: "True hits from the sick plus false alarms from the healthy."
  - id: i2
    kind: numeric
    level: apply
    difficulty: 3
    prompt: "1,000 people: 10 are sick and all 10 test positive. {f} healthy people also test positive. What percent of the positives are sick?"
    params:
      vars: { f: [40, 90, 10, 190] }
      answerExpr: "100 * 10 / (10 + f)"
    answer: 20
    tolerance: 1
    unit: "%"
    onWrong:
      "100": { misconception: accuracy-is-answer, feedback: "The test catches every case, but the positives include the healthy ones too." }
    why: "True hits divided by all positives."
  - id: i3
    kind: choice
    level: recall
    difficulty: 1
    prompt: "A test 'catches 90% of cases'. That 90% counts inside…"
    options:
      - { id: positives, text: "people who test positive", misconception: accuracy-is-answer }
      - { id: everyone, text: "everyone who was tested", misconception: base-rate-neglect }
      - { id: sick, text: "people who have the condition" }
    answer: sick
    shuffle: true
    why: "The hit rate is about the sick. Your question is about the positives."
  - id: i4
    kind: order
    level: recall
    difficulty: 2
    prompt: Put the crowd method in order.
    items:
      - "Apply the false-alarm rate to the healthy"
      - "Start with 1,000 people"
      - "Divide true hits by all positives"
      - "Split them by the base rate: sick and healthy"
      - "Apply the hit rate to the sick"
    answer: [1, 3, 4, 0, 2]
  - id: i5
    kind: estimate
    level: transfer
    difficulty: 4
    prompt: "A disease affects 1 in {n} people. A test catches every case and flags 1% of healthy people. Roughly what percent of positives have the disease?"
    params:
      vars: { n: [10000, 1000, 100000, 500] }
      answerExpr: "100 / (1 + 0.01 * (n - 1))"
    scale: { min: 0.01, max: 100, log: true, unit: "%" }
    answer: 0.990197049
    accept: { factor: 1.6 }
    onWrong:
      default: { misconception: base-rate-neglect }
    why: "Per million: 100 true cases against about 10,000 false alarms, so about 1%."
  - id: i6
    kind: widget
    level: apply
    difficulty: 3
    prompt: "Same test everywhere: catches 90%, flags 9% of healthy people. Rank the places by how trustworthy a positive is."
    widget:
      id: sorter
      v: 1
      props:
        mode: rank
        rankLabels: ["most trustworthy positive", "least trustworthy positive"]
        cards:
          - { id: half, text: "A clinic where 1 in 2 people tested have it" }
          - { id: tenth, text: "A clinic where 1 in 10 have it" }
          - { id: hundredth, text: "A screening where 1 in 100 have it" }
          - { id: thousandth, text: "A screening where 1 in 1,000 have it" }
      goal: { kind: rank, order: [half, tenth, hundredth, thousandth] }
    solution: { order: [half, tenth, hundredth, thousandth] }
    fallback:
      kind: order
      prompt: Most trustworthy positive first.
      items: ["1 in 2 have it", "1 in 10 have it", "1 in 100 have it", "1 in 1,000 have it"]
      answer: [0, 1, 2, 3]
    why: "The more common the condition among those tested, the more positives are real."
  - id: i7
    kind: match
    level: recall
    difficulty: 2
    prompt: Match each group to its name.
    left: ["True hits", "False alarms", "Missed cases", "True all-clears"]
    right: ["sick and positive", "healthy and positive", "sick and negative", "healthy and negative"]
    answer: [[0, 0], [1, 1], [2, 2], [3, 3]]
  - id: i8
    kind: choice
    level: transfer
    difficulty: 3
    prompt: A friend's screening test is positive for a rare condition. What is the sensible next step?
    options:
      - { id: retest, text: "A second, different test before concluding anything" }
      - { id: treat, text: "Start treatment: the test is 90% accurate", misconception: accuracy-is-answer }
      - { id: ignore, text: "Ignore it: positives are always false", misconception: ignore-test }
    answer: retest
    shuffle: true
    why: "A positive raises the chance a lot, from a low start. A second, independent test sorts the true hits from the false alarms."
  - id: i9
    kind: explain
    level: transfer
    difficulty: 3
    prompt: "In one sentence: why can a positive result from a test that catches 90% of cases still mean you're probably fine?"
    keyPoints:
      - { id: rare, text: "the condition is rare, so few people have it", keywords: [rare, few, "1%", base rate, uncommon] }
      - { id: false-alarms, text: "false alarms from the many healthy people outnumber the true hits", keywords: ["false", healthy, outnumber, alarms, more positives, wrongly] }
    minHits: 1
    exemplar: "The condition is rare, so the healthy people wrongly flagged far outnumber the sick people the test catches."
    offline:
      kind: choice
      prompt: Which explanation is right?
      options:
        - { id: accuracy, text: "Tests are only 90% accurate, so 10% chance", misconception: accuracy-is-answer }
        - { id: nothing, text: "A positive tells you nothing at all", misconception: ignore-test }
        - { id: right, text: "Healthy people wrongly flagged outnumber the real cases" }
      answer: right
      shuffle: true
  - id: i10
    kind: numeric
    level: apply
    difficulty: 2
    prompt: "A test with a {fpr}% false-alarm rate is used on 1,000 people, 10 of them sick. How many false alarms?"
    params:
      vars: { fpr: [5, 1, 10, 2] }
      answerExpr: "fpr / 100 * 990"
    answer: 49.5
    tolerance: 1
    why: "The false-alarm rate applies only to the 990 healthy people."
  - kind: widget
    id: st3-alarms
    prompt: 8 of the 10 people who have it test positive. The test also flags 10% of the 990 healthy people. Set the false alarms.
    widget:
      id: plot
      v: 1
      props:
        title: Dana's chance
        kind: function
        x: { label: false alarms in the crowd, min: 0, max: 150 }
        y: { label: chance a positive is real (%), min: 0, max: 100 }
        series:
          - { id: chance, label: chance a positive is real, expr: 100 * 8 / (8 + x), color: 2 }
        params:
          - { name: f, label: false alarms, min: 0, max: 150, step: 1, value: 0 }
        readouts:
          - { label: positives, expr: 8 + f, digits: 0 }
          - { label: Dana's chance, expr: 100 * 8 / (8 + f), unit: "%", digits: 1 }
        dataSource: illustrative
      goal: { kind: param, name: f, target: 99, tolerance: 1 }
    solution:
      params: { f: 99 }
    fallback: { kind: numeric, prompt: The test flags 10% of 990 healthy people. How many false alarms?, answer: 99, tolerance: 1 }
    why: "99 false alarms beside 8 true hits: Dana's chance is about 7.5%. Enough for a second test; nowhere near a diagnosis."
    level: transfer
    difficulty: 3

flashcards:
  - id: c1
    kind: qa
    front: "1% base rate, test catches 90%, flags 9% of healthy. Chance a positive is real?"
    back: "About 1 in 10: 9 true hits against about 89 false alarms per 1,000 people."
  - id: c2
    kind: qa
    front: Why do false alarms dominate when a condition is rare?
    back: "The healthy group is huge, so a small error rate on it still produces many positives."
  - id: c3
    kind: cloze
    front: "Chance a positive is real = true hits ÷ {{all positives}}."
    back: "All positives means true hits plus false alarms."
  - id: c4
    kind: qa
    front: "For a rare condition, which improvement matters most: catching more cases or fewer false alarms?"
    back: "Fewer false alarms. The healthy crowd is so big that its errors decide the answer."
  - id: c5
    kind: qa
    front: What format makes Bayes problems easier for most readers?
    back: "Natural frequencies: counts out of a crowd, such as 9 of 98, instead of percentages."

toy:
  prompt: "Find a test good enough that a positive beats a coin flip at 1 in 1,000."
  widget:
    id: plot
    v: 1
    props:
      title: "How often is a positive real?"
      kind: function
      x: { label: "people with the condition, per 1,000", min: 1, max: 500, scale: log }
      y: { label: "positives that are real (%)", min: 0, max: 100 }
      series:
        - { id: real, label: "positives that are real", expr: "100 * h * x / (h * x + f * (1000 - x))", color: 1 }
      params:
        - { name: h, label: "catches (%)", min: 50, max: 100, step: 1, value: 90, unit: "%" }
        - { name: f, label: "false alarms (%)", min: 0.1, max: 30, step: 0.1, value: 9, unit: "%" }
      dataSource: formula

underTheHood:
  title: The formula behind the crowd
  body: >
    Bayes' rule says P(sick | positive) = P(positive | sick) × P(sick) ÷ P(positive). With the
    hook's numbers: 0.9 × 0.01 ÷ (0.9 × 0.01 + 0.09 × 0.99) ≈ 0.092. The crowd of 1,000 is the
    same calculation with the decimals turned into people. Doctors call the hit rate
    sensitivity, and one minus the false-alarm rate specificity. Gigerenzer and Hoffrage found
    that presenting problems as natural frequencies (9 out of 98) instead of probabilities
    roughly tripled the share of people who reasoned correctly. In Gigerenzer's 2007 study,
    about 21% of 160 gynaecologists picked "about 1 in 10" for these numbers before training.
  sources: [gigerenzer-hoffrage-1995, gigerenzer-2007]

faq:
  - q: Is this about a real test?
    a: "No. These are the classic teaching numbers from Gigerenzer's research. Real screening programmes differ, and a real result belongs with a clinician."
  - q: Doesn't a positive at least raise the chance?
    a: "A lot. From 1% to about 9%: roughly nine times. It just doesn't make it likely."

sources:
  - { id: gigerenzer-2007, title: "Helping doctors and patients make sense of health statistics", by: "Gigerenzer, Gaissmaier, Kurz-Milcke, Schwartz & Woloshin", year: 2007, note: "Psychological Science in the Public Interest 8(2). 1% prevalence, 90% sensitivity, 9% false-positive rate; 21% of 160 gynaecologists chose the right answer." }
  - { id: gigerenzer-hoffrage-1995, title: "How to improve Bayesian reasoning without instruction: Frequency formats", by: "Gerd Gigerenzer & Ulrich Hoffrage", year: 1995, note: "Psychological Review 102(4)." }

status: draft
