<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">A hazard map in red and green</title><desc id="d">A simple map with two regions: a red zone labelled danger (#C8423B) and a green zone labelled safe (#4E8A3C). The red and green are nearly the same value.</desc><rect x="4" y="4" width="312" height="192" rx="12" fill="#F7F3EA" stroke="var(--ink, #1C1A3D)" stroke-width="2"/><path d="M20 30 L170 24 L190 110 L150 176 L24 170 Z" fill="#C8423B" stroke="var(--ink, #1C1A3D)" stroke-width="2" stroke-linejoin="round"/><path d="M178 26 L300 30 L296 172 L162 178 L200 110 Z" fill="#4E8A3C" stroke="var(--ink, #1C1A3D)" stroke-width="2" stroke-linejoin="round"/><text x="95" y="106" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">danger</text><text x="250" y="106" font-family="sans-serif" font-size="18" font-weight="700" fill="#FFFFFF" text-anchor="middle">safe</text></svg>
