<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">Poster: red on green</title><desc id="d">A poster reading Open studio, Friday at 7, in brick red letters (#C8423B) on a leaf green background (#4E8A3C). The two colours are close in value.</desc><rect x="4" y="4" width="312" height="192" rx="12" fill="#4E8A3C" stroke="var(--ink, #1C1A3D)" stroke-width="2"/><text x="160" y="98" font-family="sans-serif" font-size="42" font-weight="800" fill="#C8423B" text-anchor="middle">Open studio</text><text x="160" y="140" font-family="sans-serif" font-size="22" font-weight="700" fill="#C8423B" text-anchor="middle">Friday at 7</text></svg>
