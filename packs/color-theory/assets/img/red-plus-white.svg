<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">Red, then red plus a dab of white</title><desc id="d">Left: a bright red (#E02424). Right: the same red after a dab of white: a lighter pink (#F29A9A).</desc><rect x="4" y="4" width="312" height="192" rx="12" fill="#FFFFFF" stroke="var(--ink, #1C1A3D)" stroke-width="2"/><rect x="24" y="40" width="120" height="100" rx="10" fill="#E02424" stroke="var(--ink, #1C1A3D)" stroke-width="2"/><rect x="176" y="40" width="120" height="100" rx="10" fill="#F29A9A" stroke="var(--ink, #1C1A3D)" stroke-width="2"/><text x="84" y="168" font-family="sans-serif" font-size="16" font-weight="700" fill="var(--ink, #1C1A3D)" text-anchor="middle">before</text><text x="236" y="168" font-family="sans-serif" font-size="16" font-weight="700" fill="var(--ink, #1C1A3D)" text-anchor="middle">after</text></svg>
