<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-labelledby="t d"><title id="t">Two greys and two backgrounds</title><desc id="d">Top: two slightly different greys side by side on a white strip, a lighter grey (#969696) and a darker grey (#828282). Below: two empty backgrounds waiting for them, a light grey panel (#E4E4E4) and a dark charcoal panel (#3A3A3A), each with a dashed outline where a square could go.</desc><rect x="4" y="4" width="312" height="192" rx="12" fill="#FFFFFF" stroke="var(--ink, #1C1A3D)" stroke-width="2"/><rect x="108" y="14" width="44" height="44" fill="#969696"/><rect x="168" y="14" width="44" height="44" fill="#828282"/><text x="130" y="74" font-family="sans-serif" font-size="12" font-weight="700" fill="var(--ink, #1C1A3D)" text-anchor="middle">lighter</text><text x="190" y="74" font-family="sans-serif" font-size="12" font-weight="700" fill="var(--ink, #1C1A3D)" text-anchor="middle">darker</text><rect x="20" y="86" width="134" height="98" rx="8" fill="#E4E4E4"/><rect x="166" y="86" width="134" height="98" rx="8" fill="#3A3A3A"/><rect x="65" y="113" width="44" height="44" fill="none" stroke="#6E6E80" stroke-width="2" stroke-dasharray="5 5"/><rect x="211" y="113" width="44" height="44" fill="none" stroke="#B0B0BC" stroke-width="2" stroke-dasharray="5 5"/></svg>
