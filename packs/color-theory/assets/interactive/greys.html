<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two greys: drag them together</title>
<style>
:root{--c-bg:var(--lm-bg,#F7F3EA);--c-ink:var(--lm-ink,#1C1A3D);--c-ink2:var(--lm-ink-2,#4A4870);--c-line:var(--line-strong,#B9BDD0);--c-surface:var(--surface,#FFFFFF);--c-a1:var(--w-1,#2F5DA8);--c-a2:var(--w-3,#8A3FA0);--c-a3:var(--w-4,#4F7A1E);--c-focus:var(--focus,#12877A)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 var(--lm-font,system-ui,-apple-system,"Segoe UI",sans-serif);background:var(--c-bg);color:var(--c-ink);padding:14px 16px 16px}
button{font:inherit;font-weight:650;color:var(--c-ink);background:transparent;border:1.5px solid var(--c-ink);border-radius:12px;padding:8px 14px;box-shadow:0 3px 0 var(--c-ink);cursor:pointer;min-height:44px;transition:transform 80ms,box-shadow 80ms}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--c-ink)}
button[aria-pressed="true"]{background:var(--c-a1);color:#FFFFFF}
:focus-visible{outline:3px solid var(--c-focus);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--c-a1);min-height:32px}
label{font-weight:650}
output,.num{font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:13px;color:var(--c-ink2);margin-top:8px}
.readout{margin-top:10px;padding:8px 12px;border-radius:12px;border:1px solid var(--c-line);min-height:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:root[data-rm="1"] *{transition:none!important;animation:none!important}

.band{position:relative;height:180px;border-radius:16px;overflow:hidden;border:1px solid var(--c-line);margin-top:10px;background:linear-gradient(90deg,#1A1A1A 0 50%,#F2F2F2 50% 100%);touch-action:none}
.sq{position:absolute;top:60px;width:60px;height:60px;background:#808080}
#fixed{left:60px}
#mover{cursor:grab;outline-offset:3px}
.vals .v{position:absolute;top:130px;font-size:13px;font-weight:700;padding:2px 6px;border-radius:6px;background:#FFFFFF;color:#1C1A3D;white-space:nowrap}

</style>
</head>
<body>

<p style="margin:0">Drag the right square (or focus it and use the arrow keys) until it touches the left one.</p>
<div class="band" id="band">
  <div class="sq" id="fixed" aria-hidden="true"></div>
  <div class="sq" id="mover" role="slider" tabindex="0" aria-label="Movable grey square" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"></div>
  <div class="vals" id="vals" hidden><span class="v" id="v1">rgb(128, 128, 128)</span><span class="v" id="v2">rgb(128, 128, 128)</span></div>
</div>
<div class="row" style="margin-top:10px;flex-wrap:nowrap"><button id="show" type="button" aria-pressed="false" style="flex:none">Show the real values</button>
<div class="readout" id="read" aria-live="polite" style="margin-top:0;flex:1"></div></div>
<script>
(function () {
"use strict";
/* window.lm is the learncroc bridge, injected by the host before this script. Opened on its own,
   the file runs with a silent stand-in so it can be tried in a browser. */
var noop = function () {};
var lm = window.lm || { ready: noop, report: noop, resize: noop, announce: noop, onReveal: noop, onTest: noop,
  onInit: function (fn) { fn({ mode: "explore", theme: "light", reducedMotion: false }); } };
var root = document.documentElement;
var sayTimer = 0;
function say(text) { clearTimeout(sayTimer); sayTimer = setTimeout(function () { lm.announce(String(text).slice(0, 120)); }, 250); }


var band = document.getElementById("band"), mover = document.getElementById("mover"), pos = 100, shown = false;
var LEFT = 60, SIZE = 60;
function geom() { var w = band.clientWidth || 600; return { min: LEFT + SIZE, max: w - 60 - SIZE }; }
function render() {
  var g = geom(), x = g.min + (g.max - g.min) * pos / 100;
  mover.style.left = x + "px";
  mover.setAttribute("aria-valuenow", String(Math.round(pos)));
  var vals = document.getElementById("vals"); vals.hidden = !shown;
  document.getElementById("v1").style.left = LEFT + "px"; document.getElementById("v2").style.left = x + "px";
  document.getElementById("show").setAttribute("aria-pressed", shown ? "true" : "false");
  var side = x + SIZE / 2 < (band.clientWidth || 600) / 2 ? "dark" : "light";
  document.getElementById("read").textContent = pos <= 4 ? "Touching, both on the dark band. Same grey all along: rgb(128, 128, 128)." : "The moving square is on the " + side + " band, " + Math.round(pos) + "% of the way back.";
  mover.setAttribute("aria-valuetext", pos <= 4 ? "touching the other square" : "on the " + side + " band");
}
function setPos(p) { pos = Math.max(0, Math.min(100, p)); render(); send(); }
function current() { return Math.round(pos); }
function restore(v) { var n = Number(v); if (isFinite(n)) { pos = Math.max(0, Math.min(100, n)); render(); } }
function fromPointer(ev) { var b = band.getBoundingClientRect(), g = geom(); setPos(((ev.clientX - b.left - SIZE / 2) - g.min) / (g.max - g.min) * 100); }
mover.addEventListener("pointerdown", function (ev) {
  ev.preventDefault(); if (mover.setPointerCapture) mover.setPointerCapture(ev.pointerId); fromPointer(ev);
  function mv(e2) { fromPointer(e2); }
  function up() { mover.removeEventListener("pointermove", mv); mover.removeEventListener("pointerup", up); mover.removeEventListener("pointercancel", up); say(document.getElementById("read").textContent); }
  mover.addEventListener("pointermove", mv); mover.addEventListener("pointerup", up); mover.addEventListener("pointercancel", up);
});
mover.addEventListener("keydown", function (ev) {
  var step = ev.shiftKey ? 20 : 5;
  if (ev.key === "ArrowLeft" || ev.key === "ArrowDown") setPos(pos - step);
  else if (ev.key === "ArrowRight" || ev.key === "ArrowUp") setPos(pos + step);
  else if (ev.key === "Home") setPos(0);
  else if (ev.key === "End") setPos(100);
  else return;
  ev.preventDefault(); say(document.getElementById("read").textContent);
});
document.getElementById("show").addEventListener("click", function () { shown = !shown; render(); });
window.addEventListener("resize", render);

lm.onInit(function (s) {
  root.setAttribute("data-rm", s.reducedMotion ? "1" : "0");
  var v = s.mode === "review" && s.solution !== undefined ? s.solution : s.value;
  if (v !== undefined && v !== null) restore(v);
});
lm.onReveal(function (sol) { if (sol !== undefined && sol !== null) restore(sol); });
lm.onTest(function (v) { restore(v); send(); });
function send() { var v = current(); if (v !== null) lm.report(v); }
render();
lm.ready();
})();
</script>
</body>
</html>
