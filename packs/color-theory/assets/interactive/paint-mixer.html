<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ink mixer: three inks on paper</title>
<style>
:root{--c-bg:var(--lm-bg,#F7F3EA);--c-ink:var(--lm-ink,#1C1A3D);--c-ink2:var(--lm-ink-2,#4A4870);--c-line:var(--line-strong,#B9BDD0);--c-surface:var(--surface,#FFFFFF);--c-a1:var(--w-1,#2F5DA8);--c-a2:var(--w-3,#8A3FA0);--c-a3:var(--w-4,#4F7A1E);--c-focus:var(--focus,#12877A)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:15px/1.45 var(--lm-font,system-ui,-apple-system,"Segoe UI",sans-serif);background:var(--c-bg);color:var(--c-ink);padding:14px 16px 16px}
button{font:inherit;font-weight:650;color:var(--c-ink);background:transparent;border:1.5px solid var(--c-ink);border-radius:12px;padding:8px 14px;box-shadow:0 3px 0 var(--c-ink);cursor:pointer;min-height:44px;transition:transform 80ms,box-shadow 80ms}
button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--c-ink)}
button[aria-pressed="true"]{background:var(--c-a1);color:#FFFFFF}
:focus-visible{outline:3px solid var(--c-focus);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--c-a1);min-height:32px}
label{font-weight:650}
output,.num{font-variant-numeric:tabular-nums;font-weight:700}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.note{font-size:13px;color:var(--c-ink2);margin-top:8px}
.readout{margin-top:10px;padding:8px 12px;border-radius:12px;border:1px solid var(--c-line);min-height:40px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:root[data-rm="1"] *{transition:none!important;animation:none!important}

svg{display:block;width:100%;height:auto;border-radius:16px;border:1px solid var(--c-line)}
.mix{display:grid;grid-template-columns:minmax(0,330px) 1fr;gap:16px;align-items:center;margin-top:8px}
.toggles{display:flex;flex-direction:column;gap:8px;align-items:stretch}
@media (max-width:540px){.mix{grid-template-columns:1fr}.toggles{flex-direction:row;flex-wrap:wrap}}

</style>
</head>
<body>

<p style="margin:0">Three transparent inks printed over white paper so they overlap. Add or remove each one.</p>
<div class="mix">
<svg viewBox="0 0 400 300" role="img" aria-label="Three overlapping ink circles on white paper" id="stage">
  <rect width="400" height="300" fill="#FFFFFF"/>
  <g style="isolation:isolate">
    <circle id="cc" cx="160" cy="125" r="90" fill="#00FFFF" style="mix-blend-mode:multiply"/>
    <circle id="cm" cx="240" cy="125" r="90" fill="#FF00FF" style="mix-blend-mode:multiply"/>
    <circle id="cy" cx="200" cy="195" r="90" fill="#FFFF00" style="mix-blend-mode:multiply"/>
  </g>
  <g fill="none" stroke="#9A9AA8" stroke-dasharray="5 6" stroke-width="2"><circle cx="160" cy="125" r="90"/><circle cx="240" cy="125" r="90"/><circle cx="200" cy="195" r="90"/></g>
</svg>
<div><div class="toggles">
  <button type="button" data-ch="cyan" aria-pressed="true">Cyan ink</button>
  <button type="button" data-ch="magenta" aria-pressed="true">Magenta ink</button>
  <button type="button" data-ch="yellow" aria-pressed="true">Yellow ink</button>
</div>
<div class="readout" id="read" aria-live="polite"></div>
<p class="note">Ideal inks. Real ones are muddier, so printers add black.</p>
</div></div>
<script>
(function () {
"use strict";
/* window.lm is the learncroc bridge, injected by the host before this script. Opened on its own,
   the file runs with a silent stand-in so it can be tried in a browser. */
var noop = function () {};
var lm = window.lm || { ready: noop, report: noop, resize: noop, announce: noop, onReveal: noop, onTest: noop,
  onInit: function (fn) { fn({ mode: "explore", theme: "light", reducedMotion: false }); } };
var root = document.documentElement;
var sayTimer = 0;
function say(text) { clearTimeout(sayTimer); sayTimer = setTimeout(function () { lm.announce(String(text).slice(0, 120)); }, 250); }


var ORDER = ["cyan", "magenta", "yellow"], on = { cyan: true, magenta: true, yellow: true };
var MIXNAME = { "": "white paper", "cyan": "cyan", "magenta": "magenta", "yellow": "yellow", "cyan+magenta": "blue", "cyan+yellow": "green", "magenta+yellow": "red", "cyan+magenta+yellow": "near black" };
document.querySelector(".toggles").addEventListener("click", function (e) {
  var c = e.target.getAttribute && e.target.getAttribute("data-ch"); if (!c) return;
  on[c] = !on[c]; render(); send(); say(c + " ink " + (on[c] ? "on" : "off") + ". Overlap: " + MIXNAME[key()]);
});
function key() { return ORDER.filter(function (c) { return on[c]; }).join("+"); }
function render() {
  ORDER.forEach(function (c) { document.getElementById("c" + c[0]).setAttribute("opacity", on[c] ? "1" : "0"); document.querySelector('[data-ch="' + c + '"]').setAttribute("aria-pressed", on[c] ? "true" : "false"); });
  var k = key(), lit = k ? k.split("+") : [];
  document.getElementById("read").textContent = lit.length < 2 ? "Inks: " + (lit[0] || "none") + "." : "Inks: " + lit.join(" and ") + ". Where all of them overlap: " + MIXNAME[k] + ".";
}
function current() { return key() || "none"; }
function restore(v) { if (typeof v !== "string") return; var parts = v === "none" ? [] : v.split("+"); ORDER.forEach(function (c) { on[c] = parts.indexOf(c) >= 0; }); render(); }

lm.onInit(function (s) {
  root.setAttribute("data-rm", s.reducedMotion ? "1" : "0");
  var v = s.mode === "review" && s.solution !== undefined ? s.solution : s.value;
  if (v !== undefined && v !== null) restore(v);
});
lm.onReveal(function (sol) { if (sol !== undefined && sol !== null) restore(sol); });
lm.onTest(function (v) { restore(v); send(); });
function send() { var v = current(); if (v !== null) lm.report(v); }
render();
lm.ready();
})();
</script>
</body>
</html>
