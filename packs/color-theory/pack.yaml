outcomes:
  - Describe any color with hue, saturation and lightness, and change one without the others
  - Predict what mixing lights or inks will make, and pick a color's complement
  - Use value and simultaneous contrast to make a design read, and spot when your eyes are fooled
ai:
  tutorNotes: >
    Always name colors in words (and hex where useful), never by swatch alone. HSL numbers follow
    CSS conventions. Distinguish HSL lightness (screen maths) from perceived value (CIELAB L*).
    Screen complements use the RGB/HSL wheel (red opposite cyan); the painter's RYB wheel pairs
    red with green; say which wheel you mean. Color psychology claims are weak: teach convention,
    not effects on mood or appetite.
