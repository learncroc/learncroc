<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">The app re-sends the chat</title><desc id="d">Three chat turns, one per row. In each row the app packs the whole transcript so far into one bundle and sends it into the same model box. The bundle grows every turn: one message on turn one, three on turn two, five on turn three. The model box keeps nothing between rows.</desc><g font-size="18" fill="var(--ink)" text-anchor="end"><text x="110" y="113">turn 1</text><text x="110" y="221">turn 2</text><text x="110" y="381">turn 3</text></g><g fill="var(--w-1)"><rect x="140" y="95" width="190" height="24" rx="6"/><rect x="140" y="175" width="190" height="24" rx="6"/><rect x="140" y="231" width="190" height="24" rx="6"/><rect x="140" y="307" width="190" height="24" rx="6"/><rect x="140" y="363" width="190" height="24" rx="6"/><rect x="140" y="419" width="190" height="24" rx="6"/></g><g fill="var(--w-2)"><rect x="140" y="203" width="190" height="24" rx="6"/><rect x="140" y="335" width="190" height="24" rx="6"/><rect x="140" y="391" width="190" height="24" rx="6"/></g><g fill="none" stroke="var(--sea)" stroke-width="2"><rect x="128" y="83" width="214" height="48" rx="10"/><rect x="128" y="163" width="214" height="104" rx="10"/><rect x="128" y="295" width="214" height="160" rx="10"/></g><g stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M360 107 L560 107"/><path d="M548 99 L560 107 L548 115"/><path d="M360 215 L560 215"/><path d="M548 207 L560 215 L548 223"/><path d="M360 375 L560 375"/><path d="M548 367 L560 375 L548 383"/></g><g fill="none" stroke="var(--ink)" stroke-width="2"><rect x="580" y="77" width="150" height="60" rx="12"/><rect x="580" y="185" width="150" height="60" rx="12"/><rect x="580" y="345" width="150" height="60" rx="12"/></g><g font-size="18" fill="var(--ink)" text-anchor="middle"><text x="655" y="113">model</text><text x="655" y="221">model</text><text x="655" y="381">model</text><text x="460" y="92">whole chat</text><text x="460" y="200">whole chat again</text><text x="460" y="360">and again</text></g><text x="235" y="50" font-size="20" fill="var(--ink)" text-anchor="middle">transcript so far</text><text x="655" y="50" font-size="20" fill="var(--ink)" text-anchor="middle">keeps nothing</text></svg>
