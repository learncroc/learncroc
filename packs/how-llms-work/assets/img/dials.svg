<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">A network of dials</title><desc id="d">Three inputs on the left feed a layer of four dials, which feed a second layer of three dials, which feed one output on the right. Every connection has its own weight.</desc><g stroke="var(--w-3)" stroke-width="2" stroke-linecap="round" fill="none"><path d="M120 150 L330 110 M120 150 L330 210 M120 150 L330 310 M120 150 L330 410 M120 250 L330 110 M120 250 L330 210 M120 250 L330 310 M120 250 L330 410 M120 350 L330 110 M120 350 L330 210 M120 350 L330 310 M120 350 L330 410"/><path d="M330 110 L520 160 M330 110 L520 260 M330 110 L520 360 M330 210 L520 160 M330 210 L520 260 M330 210 L520 360 M330 310 L520 160 M330 310 L520 260 M330 310 L520 360 M330 410 L520 160 M330 410 L520 260 M330 410 L520 360"/><path d="M520 160 L700 260 M520 260 L700 260 M520 360 L700 260"/></g><g fill="var(--w-1)" stroke="var(--w-1)" stroke-width="2"><circle cx="120" cy="150" r="16"/><circle cx="120" cy="250" r="16"/><circle cx="120" cy="350" r="16"/></g><g stroke="var(--w-2)" stroke-width="2" fill="none"><circle cx="330" cy="110" r="26"/><circle cx="330" cy="210" r="26"/><circle cx="330" cy="310" r="26"/><circle cx="330" cy="410" r="26"/><circle cx="520" cy="160" r="26"/><circle cx="520" cy="260" r="26"/><circle cx="520" cy="360" r="26"/></g><g stroke="var(--ink)" stroke-width="2" stroke-linecap="round"><path d="M330 110 L344 96 M330 210 L318 192 M330 310 L348 314 M330 410 L322 392 M520 160 L536 150 M520 260 L506 244 M520 360 L538 368"/></g><circle cx="700" cy="260" r="22" fill="var(--sea)" stroke="var(--sea)" stroke-width="2"/><text x="120" y="420" font-size="18" fill="var(--ink)" text-anchor="middle">inputs</text><text x="425" y="470" font-size="18" fill="var(--ink)" text-anchor="middle">weights everywhere</text><text x="700" y="310" font-size="18" fill="var(--ink)" text-anchor="middle">output</text></svg>
