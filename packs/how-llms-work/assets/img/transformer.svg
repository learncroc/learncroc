<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">The transformer stack</title><desc id="d">A tower of repeated blocks between the embeddings at the bottom and the scores at the top. Each block holds an attention layer and an MLP layer. An arrow, the running vector, passes up through every block.</desc><rect x="250" y="440" width="300" height="40" rx="10" fill="none" stroke="var(--w-1)" stroke-width="2"/><text x="400" y="466" font-size="18" fill="var(--ink)" text-anchor="middle">embeddings</text><g fill="none" stroke="var(--w-3)" stroke-width="2"><rect x="230" y="330" width="340" height="90" rx="14"/><rect x="230" y="210" width="340" height="90" rx="14"/><rect x="230" y="60" width="340" height="90" rx="14"/></g><g fill="none" stroke="var(--w-2)" stroke-width="2"><rect x="250" y="350" width="140" height="50" rx="8"/><rect x="250" y="230" width="140" height="50" rx="8"/><rect x="250" y="80" width="140" height="50" rx="8"/></g><g fill="none" stroke="var(--w-4)" stroke-width="2"><rect x="410" y="350" width="140" height="50" rx="8"/><rect x="410" y="230" width="140" height="50" rx="8"/><rect x="410" y="80" width="140" height="50" rx="8"/></g><g font-size="16" fill="var(--ink)" text-anchor="middle"><text x="320" y="381">attention</text><text x="480" y="381">MLP</text><text x="320" y="261">attention</text><text x="480" y="261">MLP</text><text x="320" y="111">attention</text><text x="480" y="111">MLP</text></g><text x="400" y="186" font-size="20" fill="var(--ink)" text-anchor="middle">· · ·</text><rect x="300" y="6" width="200" height="40" rx="10" fill="none" stroke="var(--sea)" stroke-width="2"/><text x="400" y="32" font-size="18" fill="var(--ink)" text-anchor="middle">scores</text><path d="M640 470 L640 30" stroke="var(--sea)" stroke-width="2" stroke-linecap="round"/><path d="M632 42 L640 28 L648 42" stroke="var(--sea)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="700" y="250" font-size="16" fill="var(--ink)" text-anchor="middle">running vector</text><text x="140" y="250" font-size="16" fill="var(--ink)" text-anchor="middle">12 blocks</text></svg>
