<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">The generation loop</title><desc id="d">Text so far goes into the network. The network outputs a bar for every possible next token. One token is picked and appended to the end of the text, and the loop runs again.</desc><rect x="40" y="70" width="250" height="70" rx="14" fill="none" stroke="var(--w-1)" stroke-width="2"/><text x="165" y="113" font-size="20" fill="var(--ink)" text-anchor="middle">The cat sat …</text><text x="165" y="52" font-size="16" fill="var(--ink)" text-anchor="middle">text so far</text><path d="M290 105 L370 105" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M360 97 L372 105 L360 113" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="380" y="55" width="160" height="100" rx="18" fill="none" stroke="var(--w-2)" stroke-width="2"/><text x="460" y="112" font-size="20" fill="var(--ink)" text-anchor="middle">network</text><path d="M460 155 L460 215" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M452 205 L460 217 L468 205" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><path d="M370 380 L560 380" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/><rect x="380" y="270" width="26" height="110" rx="3" fill="var(--w-3)"/><rect x="416" y="300" width="26" height="80" rx="3" fill="var(--w-3)"/><rect x="452" y="320" width="26" height="60" rx="3" fill="var(--w-3)"/><rect x="488" y="345" width="26" height="35" rx="3" fill="var(--w-3)"/><rect x="524" y="365" width="26" height="15" rx="3" fill="var(--w-3)"/><text x="465" y="415" font-size="16" fill="var(--ink)" text-anchor="middle">a score per token</text><path d="M370 300 C 300 300, 250 300, 230 300" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M240 292 L228 300 L240 308" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="300" y="285" font-size="16" fill="var(--ink)" text-anchor="middle">pick one</text><rect x="130" y="272" width="96" height="56" rx="12" fill="none" stroke="var(--sea)" stroke-width="2"/><text x="178" y="307" font-size="20" fill="var(--ink)" text-anchor="middle">floor</text><path d="M150 272 C 120 220, 110 180, 140 146" stroke="var(--sea)" stroke-width="2" stroke-linecap="round" fill="none"/><path d="M130 152 L142 143 L145 158" stroke="var(--sea)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="56" y="215" font-size="16" fill="var(--ink)" text-anchor="middle">append, repeat</text></svg>
