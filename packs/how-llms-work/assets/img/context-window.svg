<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">The context window</title><desc id="d">A conveyor of token tiles moves right. A fixed frame covers the six newest tiles. Older tiles to the left of the frame tip off the end of the belt.</desc><path d="M40 330 L760 330" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><g fill="none" stroke="var(--ink)" stroke-width="2"><circle cx="60" cy="350" r="14"/><circle cx="260" cy="350" r="14"/><circle cx="460" cy="350" r="14"/><circle cx="660" cy="350" r="14"/></g><g fill="var(--w-1)"><rect x="300" y="260" width="64" height="64" rx="8"/><rect x="374" y="260" width="64" height="64" rx="8"/><rect x="448" y="260" width="64" height="64" rx="8"/><rect x="522" y="260" width="64" height="64" rx="8"/><rect x="596" y="260" width="64" height="64" rx="8"/><rect x="670" y="260" width="64" height="64" rx="8"/></g><g fill="var(--w-4)"><rect x="200" y="260" width="64" height="64" rx="8"/><rect x="118" y="276" width="64" height="64" rx="8" transform="rotate(-20 150 308)"/><rect x="40" y="330" width="64" height="64" rx="8" transform="rotate(-45 72 362)"/></g><rect x="288" y="240" width="458" height="104" rx="14" fill="none" stroke="var(--sea)" stroke-width="2"/><text x="517" y="220" font-size="20" fill="var(--ink)" text-anchor="middle">context window</text><text x="130" y="230" font-size="18" fill="var(--ink)" text-anchor="middle">falls off</text><text x="702" y="390" font-size="18" fill="var(--ink)" text-anchor="middle">newest</text><path d="M560 120 L720 120" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><path d="M708 112 L720 120 L708 128" stroke="var(--ink)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><text x="640" y="100" font-size="16" fill="var(--ink)" text-anchor="middle">new tokens arrive</text></svg>
