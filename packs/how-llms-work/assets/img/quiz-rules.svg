<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">Two scoring rules</title><desc id="d">Two scoreboards side by side. Rule A: right answer plus one, wrong answer zero, pass zero. Rule B: right answer plus one, wrong answer minus one, pass zero.</desc><rect x="70" y="70" width="300" height="360" rx="18" fill="none" stroke="var(--w-1)" stroke-width="2"/><rect x="430" y="70" width="300" height="360" rx="18" fill="none" stroke="var(--w-3)" stroke-width="2"/><text x="220" y="125" font-size="26" fill="var(--ink)" text-anchor="middle">Rule A</text><text x="580" y="125" font-size="26" fill="var(--ink)" text-anchor="middle">Rule B</text><path d="M100 150 L340 150 M460 150 L700 150" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><g font-size="22" fill="var(--ink)"><text x="110" y="215">right</text><text x="110" y="295">wrong</text><text x="110" y="375">pass</text><text x="470" y="215">right</text><text x="470" y="295">wrong</text><text x="470" y="375">pass</text></g><g font-size="22" fill="var(--ink)" text-anchor="end"><text x="330" y="215">+1</text><text x="330" y="295">0</text><text x="330" y="375">0</text><text x="690" y="215">+1</text><text x="690" y="295">−1</text><text x="690" y="375">0</text></g><rect x="640" y="268" width="64" height="40" rx="8" fill="none" stroke="var(--sea)" stroke-width="2"/></svg>
