<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="t d"><title id="t">Rolling down the loss</title><desc id="d">A U-shaped curve of loss against one weight. A ball sits high on the left slope with an arrow pointing down the slope toward the lowest point.</desc><path d="M80 440 L740 440" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><path d="M80 440 L80 50" stroke="var(--ink)" stroke-width="2" stroke-linecap="round"/><path d="M110 80 C 250 470, 550 470, 700 80" stroke="var(--w-4)" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="205" cy="232" r="22" fill="var(--w-2)" stroke="var(--w-2)" stroke-width="2"/><path d="M240 270 L320 340" stroke="var(--sea)" stroke-width="2" stroke-linecap="round"/><path d="M304 338 L322 342 L316 324" stroke="var(--sea)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/><circle cx="405" cy="372" r="6" fill="var(--sea)"/><text x="405" y="410" font-size="18" fill="var(--ink)" text-anchor="middle">lowest loss</text><text x="60" y="70" font-size="18" fill="var(--ink)" text-anchor="end">loss</text><text x="740" y="475" font-size="18" fill="var(--ink)" text-anchor="end">weight</text><text x="330" y="300" font-size="16" fill="var(--ink)">step downhill</text></svg>
