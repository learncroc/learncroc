entry: { suggestedStart: tokens }
outcomes:
  - Explain why a model miscounts letters, and what it reads instead
  - Say what a language model computes at every step, and why replies stream in
  - Trace a sentence through tokens, embeddings, attention and the transformer stack
  - Say why a fluent model can state false things, and what actually helps
ai:
  tutorNotes: >
    Numbers marked "computed with GPT-2" come from scripts/precompute (GPT-2 small, 124M parameters).
    Attention weights on the cards are illustrative. Don't claim models never plan ahead
    (interpretability work shows some lookahead), that they "know nothing", or that temperature 0
    prevents mistakes. Prefer "scores" and "probabilities" over "thinks" and "wants".
